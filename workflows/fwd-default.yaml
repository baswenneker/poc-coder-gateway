# Workflow Definition: the Rules a team wants its developers to follow.
# The Decider judges the Rules at the end of a Turn (the model's final reply) and when a tool call
# of the model matches the `trigger` of a Block Rule (see docs/DECISIONS.md #28).
# `broken_when` is phrased so that TRUE means the Rule is broken.
# `intervention` is one of: flag | propose | block. A Rule only blocks when its intervention is
# explicitly `block`, and a Block Rule needs a `trigger`: a regex matched (case-insensitive) against
# the string values in the arguments of a tool call (whitespace runs made one space, first 8,000
# characters), optionally limited to some tool names (`tools: [bash]`). Keep trigger regexes simple.
name: fwd-default

phases:
  - id: explore
    description: The developer is asking questions or reading code; no changes yet.
  - id: implement
    description: Code is being written or edited.
  - id: verify
    description: Tests, lint or builds are being run.
  - id: ship
    description: Committing, pushing or opening a pull request.

rules:
  - id: propose_issue
    description: Work is traceable to an issue.
    broken_when: >-
      Code was changed in this conversation (the assistant edited or wrote files, or ran a command
      that changes code), and nowhere in the conversation is an issue, ticket or work item referenced
      (e.g. '#123', 'issue 42', 'JIRA-7', a GitHub/GitLab issue URL). A question about creating an
      issue that the developer declined is not a reference: the rule stays broken.
    ok_when: >-
      An issue or ticket is referenced anywhere in the conversation, or no code was changed
      (the developer only asked questions or explored the code).
    intervention: propose
    threshold: 0.7
    proposal:
      question: >-
        No issue has been mentioned for this work. Shall we create one so it is traceable?
      header: Create issue?
      accept_label: Yes, create an issue
      accept_description: Create an issue for this work
      decline_label: No, not needed
      decline_description: No issue for this work

  - id: flag_no_spec
    description: Code changes are based on a discussed spec file.
    broken_when: >-
      Code is being changed or the developer asks for code changes, and no specification file
      (e.g. SPEC.md, PLAN.md, a design doc, docs/*.md describing the change) has been mentioned,
      read or discussed in the conversation.
    ok_when: >-
      A spec or plan file has been mentioned, read or discussed, or no code is being changed.
    intervention: flag
    threshold: 0.7

  - id: block_pr_without_tests
    description: A pull request is only opened (or code pushed) after tests are reported green.
    broken_when: >-
      The latest assistant message makes a tool call that creates a pull request or merge request,
      or pushes code (for example 'gh pr create', 'glab mr create' or 'git push'), and the
      conversation does not show a passing test run after the last code change.
    ok_when: >-
      The latest assistant message makes no such tool call (a command that is only mentioned or
      explained in text does not count); or a test run that passed is shown after the last code
      change. A linter or type check is not a test run.
    intervention: block
    threshold: 0.7
    trigger:
      # Global git options (`git -C /path push`, `git -c k=v push`) may sit between git and push. An
      # option value never starts with '-', so the regex stays linear (DECISIONS.md #34, #35).
      pattern: '\bgh\s+pr\s+create\b|\bglab\s+mr\s+create\b|\bgit\b(\s+-\S+(\s+[^\s-]\S*)?)*\s+push\b'
    block_message: >-
      The Gateway stopped this step: the model wanted to open a pull request or push code, but this
      conversation does not show the tests passing after the last change. Run the tests first and
      show that they pass; then ask for the pull request again.
