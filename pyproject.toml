[project]
name = "coder-gateway"
version = "0.1.0"
description = "OpenAI-compatible gateway that steers coding-agent conversations towards a team workflow"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Bas Wenneker" }]
readme = "README.md"
keywords = ["coding-agent", "llm", "gateway", "openai", "opencode", "developer-workflow", "guardrails"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openai>=3.19.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "typesafe-sdk>=0.7.1",
    "uvicorn[standard]>=0.53.0",
]

[project.urls]
Repository = "https://github.com/baswenneker/poc-coder-gateway"

[project.scripts]
coder-gateway = "coder_gateway.cli:main"
benchmark = "coder_gateway.benchmark:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coder_gateway"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "mypy>=1.15",
    "ruff>=0.9",
    "types-PyYAML>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: calls real external APIs (Jev/OpenAI); deselect with -m 'not live'"]
addopts = "-m 'not live'"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
